[project]
name = "syner-check-web"
version = "1.0.0"
description = "Consulta web de comprobantes SynerCOM con FastAPI y Google Workspace"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "authlib>=1.6,<2",
  "itsdangerous>=2.2,<3",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "pyodbc>=5.3,<6",
  # authlib's Starlette integration imports httpx2 (its supported HTTP client);
  # the old httpx fallback is deprecated upstream.
  "httpx2>=2.13,<3",
]

[project.scripts]
syner-check = "syner_check.main:main"

[dependency-groups]
# Tooling only: Docker installs the runtime deps with `pip install .`, which
# ignores this group.
dev = [
  "pytest>=8",
  "ruff>=0.9",
  # Starlette's TestClient is built on httpx; runtime uses httpx2 (authlib).
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "syner_check", "src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# GraphQL query strings are atomic; splitting them adds noise, not clarity.
"app/graphql.py" = ["E501"]
